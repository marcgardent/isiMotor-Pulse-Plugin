[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isimotor-telemetry-benchmark"
version = "1.0.0"
description = "Real-time UDP packet sniffer, frequency benchmark & telemetry inspector with Textual TUI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "textual>=0.50.0",
    "rich>=13.0.0"
]

[project.scripts]
isi-benchmark = "sniffer:main"
