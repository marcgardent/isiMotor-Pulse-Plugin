name: CI & Static Analysis

on:
  pull_request:
    branches: [ main, master ]

jobs:
  static-analysis:
    name: Static Analysis (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Run Ruff Linter
        run: make lint

      - name: Run Ruff Formatter Check
        run: make format-check

      - name: Run Mypy Type Checker
        run: make typecheck

  test:
    name: Tests & Mock Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build C++ Mock & Run Tests
        run: |
          make test

  build-plugin:
    name: Cross-Compile Plugin DLL (MinGW-w64 Standard)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW-w64 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake ninja-build

      - name: Cross-Compile isiMotor_Pulse.dll
        run: |
          make cross

      - name: Verify Built DLL
        run: |
          test -f build/isiMotor_Pulse.dll
          ls -lh build/isiMotor_Pulse.dll

  schemas-crate-check:
    name: Rust Schemas Crate Build (isimotor-pulse-schemas)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build isimotor-pulse-schemas (codegen via build.rs)
        run: |
          make cargo-check

  package-check:
    name: Python Packages Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build Python packages & validate with twine
        run: |
          uv run --with build python -m build binding/python/isimotor-pulse-types
          uv run --with build python -m build isimotor-pulse-client
          uv run --with build python -m build isimotor-pulse-manager
          uv run --with twine twine check binding/python/isimotor-pulse-types/dist/* isimotor-pulse-client/dist/* isimotor-pulse-manager/dist/*

