name: CI & Static Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  static-analysis:
    name: Static Analysis (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Run Ruff Linter
        run: uv run --with ruff ruff check .

      - name: Run Ruff Formatter Check
        run: uv run --with ruff ruff format --check .

      - name: Run Mypy Type Checker
        run: uv run --with mypy --with textual --with rich mypy

  test:
    name: Tests & Mock Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./isimotor-rawudp-client

      - name: Build C++ Mock & Run Tests
        run: |
          make test
