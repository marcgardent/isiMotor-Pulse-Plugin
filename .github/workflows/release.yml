name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'

permissions:
  contents: write

jobs:
  # --- 1. Gatekeeper Tests ---
  run-tests:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build C++ Mock Host & Run Tests
        run: |
          make test

  # --- 2. Build Universal Plugin DLL (MinGW-w64 Cross-Compilation) ---
  build-dll:
    name: Build Universal DLL (MinGW-w64 Cross)
    runs-on: ubuntu-latest
    needs: [run-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW-w64 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake ninja-build

      - name: Build Universal isiMotor_RawUDP.dll
        run: |
          make cross

      - name: Verify Built DLL
        run: |
          test -f build/isiMotor_RawUDP.dll
          ls -lh build/isiMotor_RawUDP.dll

      - name: Upload Universal DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-universal-dll
          path: build/isiMotor_RawUDP.dll

  # --- 3. Package Python Client & Manager ---
  package-python:
    name: Build Python Packages
    runs-on: ubuntu-latest
    needs: [run-tests, build-dll]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Built DLL
        uses: actions/download-artifact@v4
        with:
          name: release-universal-dll
          path: build/

      - name: Sync DLL into Manager Package Resources
        run: |
          mkdir -p isimotor-rawudp-manager/isimotor_rawudp_manager/resources isimotor-rawudp-manager/resources
          cp build/isiMotor_RawUDP.dll isimotor-rawudp-manager/isimotor_rawudp_manager/resources/
          cp build/isiMotor_RawUDP.dll isimotor-rawudp-manager/resources/

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build Python Packages
        run: |
          uv run --with build python -m build isimotor-rawudp-client
          uv run --with build python -m build isimotor-rawudp-manager

      - name: Validate Distributions
        run: |
          uv run --with twine twine check isimotor-rawudp-client/dist/* isimotor-rawudp-manager/dist/*

      - name: Upload Python Dists
        uses: actions/upload-artifact@v4
        with:
          name: release-python-dist
          path: |
            isimotor-rawudp-client/dist/*
            isimotor-rawudp-manager/dist/*

  # --- 4. Publish Release Assets ---
  publish-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-dll, package-python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Tag Name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download Universal DLL
        uses: actions/download-artifact@v4
        with:
          name: release-universal-dll
          path: staging/

      - name: Download Python Dists
        uses: actions/download-artifact@v4
        with:
          name: release-python-dist
          path: dist/

      - name: Prepare Release Package & Assets
        run: |
          TAG="${{ steps.vars.outputs.TAG }}"
          mkdir -p staging_redist
          cp staging/isiMotor_RawUDP.dll staging_redist/
          cp docs/INSTALL_REDIST_RawUDP-Plugin.txt staging_redist/
          cp LICENSE staging_redist/
          cp README.md staging_redist/

          # Package redistributable release zip
          cd staging_redist
          zip -r "../isiMotor-RawUDP-Plugin-${TAG}-Redist.zip" .
          cp "../isiMotor-RawUDP-Plugin-${TAG}-Redist.zip" "../isiMotor-RawUDP-Plugin-${TAG}-Universal.zip"
          cp "../isiMotor-RawUDP-Plugin-${TAG}-Redist.zip" "../isiMotor-RawUDP-Plugin-${TAG}-Windows-x64.zip"
          cd ..

          mkdir -p release_assets
          cp staging/isiMotor_RawUDP.dll release_assets/
          cp docs/INSTALL_REDIST_RawUDP-Plugin.txt release_assets/
          cp "isiMotor-RawUDP-Plugin-${TAG}-Redist.zip" release_assets/
          cp "isiMotor-RawUDP-Plugin-${TAG}-Universal.zip" release_assets/
          cp "isiMotor-RawUDP-Plugin-${TAG}-Windows-x64.zip" release_assets/
          cp dist/* release_assets/
          ls -lh release_assets/

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: isiMotor-RawUDP Plugin ${{ steps.vars.outputs.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

