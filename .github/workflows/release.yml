name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'

permissions:
  contents: write

jobs:
  # --- 1. Gatekeeper Tests ---
  run-tests:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build C++ Mock Host & Run Tests
        run: |
          make test

  # --- 2. Build Universal Plugin DLL (MinGW-w64 Cross-Compilation) ---
  build-dll:
    name: Build Universal DLL (MinGW-w64 Cross)
    runs-on: ubuntu-latest
    needs: [run-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW-w64 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake ninja-build

      - name: Build Universal isiMotor_RawUDP.dll
        run: |
          make cross

      - name: Verify Built DLL
        run: |
          test -f build/isiMotor_RawUDP.dll
          ls -lh build/isiMotor_RawUDP.dll

      - name: Upload Universal DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-universal-dll
          path: build/isiMotor_RawUDP.dll

  # --- 3. Build Standalone Manager for Windows (.exe) ---
  build-manager-windows:
    name: Build Standalone Manager (Windows x64)
    runs-on: windows-latest
    needs: [run-tests, build-dll]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Built DLL
        uses: actions/download-artifact@v4
        with:
          name: release-universal-dll
          path: staging/

      - name: Sync DLL into Manager Package Resources
        shell: bash
        run: |
          mkdir -p isimotor-rawudp-manager/isimotor_rawudp_manager/resources isimotor-rawudp-manager/resources
          cp staging/isiMotor_RawUDP.dll isimotor-rawudp-manager/isimotor_rawudp_manager/resources/
          cp staging/isiMotor_RawUDP.dll isimotor-rawudp-manager/resources/

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build Standalone Windows EXE with PyInstaller
        shell: bash
        run: |
          PYTHONPATH="isimotor-rawudp-client:isimotor-rawudp-manager" uv run --with pyinstaller --with textual --with rich pyinstaller --onefile --clean --name "isiMotor_RawUDP_Manager" --add-data "isimotor-rawudp-manager/isimotor_rawudp_manager/resources;isimotor_rawudp_manager/resources" --collect-all textual --collect-all rich --collect-all isimotor_rawudp_manager --collect-all isimotor_rawudp_client scripts/entrypoint_manager.py

      - name: Upload Windows Manager Executable
        uses: actions/upload-artifact@v4
        with:
          name: release-manager-windows
          path: dist/isiMotor_RawUDP_Manager.exe

  # --- 4. Build Standalone Manager for Linux (x86_64) ---
  build-manager-linux:
    name: Build Standalone Manager (Linux x86_64)
    runs-on: ubuntu-latest
    needs: [run-tests, build-dll]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Built DLL
        uses: actions/download-artifact@v4
        with:
          name: release-universal-dll
          path: staging/

      - name: Sync DLL into Manager Package Resources
        run: |
          mkdir -p isimotor-rawudp-manager/isimotor_rawudp_manager/resources isimotor-rawudp-manager/resources
          cp staging/isiMotor_RawUDP.dll isimotor-rawudp-manager/isimotor_rawudp_manager/resources/
          cp staging/isiMotor_RawUDP.dll isimotor-rawudp-manager/resources/

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build Standalone Linux Binary with PyInstaller
        run: |
          PYTHONPATH="isimotor-rawudp-client:isimotor-rawudp-manager" uv run --with pyinstaller --with textual --with rich pyinstaller --onefile --clean --name "isiMotor-RawUDP-Manager-x86_64" --add-data "isimotor-rawudp-manager/isimotor_rawudp_manager/resources:isimotor_rawudp_manager/resources" --collect-all textual --collect-all rich --collect-all isimotor_rawudp_manager --collect-all isimotor_rawudp_client scripts/entrypoint_manager.py

      - name: Upload Linux Manager Executable
        uses: actions/upload-artifact@v4
        with:
          name: release-manager-linux
          path: dist/isiMotor-RawUDP-Manager-x86_64

  # --- 5. Package Python Client & Manager ---
  package-python:
    name: Build Python Packages
    runs-on: ubuntu-latest
    needs: [run-tests, build-dll]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Built DLL
        uses: actions/download-artifact@v4
        with:
          name: release-universal-dll
          path: build/

      - name: Sync DLL into Manager Package Resources
        run: |
          mkdir -p isimotor-rawudp-manager/isimotor_rawudp_manager/resources isimotor-rawudp-manager/resources
          cp build/isiMotor_RawUDP.dll isimotor-rawudp-manager/isimotor_rawudp_manager/resources/
          cp build/isiMotor_RawUDP.dll isimotor-rawudp-manager/resources/

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build Python Packages
        run: |
          uv run --with build python -m build isimotor-rawudp-client
          uv run --with build python -m build isimotor-rawudp-manager

      - name: Validate Distributions
        run: |
          uv run --with twine twine check isimotor-rawudp-client/dist/* isimotor-rawudp-manager/dist/*

      - name: Upload Python Dists
        uses: actions/upload-artifact@v4
        with:
          name: release-python-dist
          path: |
            isimotor-rawudp-client/dist/*
            isimotor-rawudp-manager/dist/*

  # --- 6. Publish Release Assets ---
  publish-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-dll, build-manager-windows, build-manager-linux, package-python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Tag Name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download Universal DLL
        uses: actions/download-artifact@v4
        with:
          name: release-universal-dll
          path: staging/

      - name: Download Windows Manager Executable
        uses: actions/download-artifact@v4
        with:
          name: release-manager-windows
          path: staging_manager_win/

      - name: Download Linux Manager Executable
        uses: actions/download-artifact@v4
        with:
          name: release-manager-linux
          path: staging_manager_linux/

      - name: Download Python Dists
        uses: actions/download-artifact@v4
        with:
          name: release-python-dist
          path: dist/

      - name: Prepare Release Package & Assets
        run: |
          TAG="${{ steps.vars.outputs.TAG }}"
          mkdir -p staging_redist
          cp staging/isiMotor_RawUDP.dll staging_redist/
          cp docs/INSTALL_REDIST_RawUDP-Plugin.txt staging_redist/
          cp LICENSE staging_redist/
          cp README.md staging_redist/

          # Package redistributable release zip for Windows x64 (MinGW-w64)
          cd staging_redist
          zip -r "../isiMotor-RawUDP-Plugin-${TAG}-Windows-x64-MinGW-w64.zip" .
          cd ..

          mkdir -p release_assets
          cp "isiMotor-RawUDP-Plugin-${TAG}-Windows-x64-MinGW-w64.zip" release_assets/
          cp staging_manager_win/isiMotor_RawUDP_Manager.exe release_assets/
          cp staging_manager_linux/isiMotor-RawUDP-Manager-x86_64 release_assets/
          find dist -type f -exec cp {} release_assets/ \;
          ls -lh release_assets/

      - name: Generate Release Notes Body
        id: release_body
        run: |
          TAG="${{ steps.vars.outputs.TAG }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"

          cat > release_body.md << 'RELEASE_BODY_EOF'
          ## 🏎️ isiMotor-RawUDP Plugin ${TAG}

          Native high-performance telemetry streaming plugin for **Le Mans Ultimate** and **rFactor 2** (isiMotor engine).
          Includes standalone executable managers and a **Python SDK**.

          ---

          ### 📦 Release Assets

          #### 🖥️ Standalone Manager (1-Click Install & Live Telemetry TUI)
          | Platform | File | Description |
          |----------|------|-------------|
          | **Windows (x64)** | `isiMotor_RawUDP_Manager.exe` | Standalone portable executable (No Python required) |
          | **Linux / Steam Deck** | `isiMotor-RawUDP-Manager-x86_64` | Standalone 64-bit binary (No Python required) |

          👉 **User Guide**: [USER_NOTICE.md](${REPO_URL}/blob/${TAG}/USER_NOTICE.md)

          ---

          #### 🔧 Native Plugin (Windows x64 / MinGW-w64)
          | File | Description |
          |------|-------------|
          | `isiMotor-RawUDP-Plugin-${TAG}-Windows-x64-MinGW-w64.zip` | Standalone native 64-bit DLL (MinGW-w64) + installation instructions + license |

          👉 **Install Guide**: [docs/INSTALL_REDIST_RawUDP-Plugin.txt](${REPO_URL}/blob/${TAG}/docs/INSTALL_REDIST_RawUDP-Plugin.txt)

          ---

          #### 🐍 Python Packages
          | Package | Description |
          |---------|-------------|
          | `isimotor_rawudp_client` | Low-level UDP client & binary packet decoders |
          | `isimotor_rawudp_manager` | TUI Manager application, live sniffer & automated installer |

          ```bash
          pip install isimotor_rawudp_manager
          ```

          👉 **Client README**: [isimotor-rawudp-client/README.md](${REPO_URL}/blob/${TAG}/isimotor-rawudp-client/README.md)  
          👉 **Manager README**: [isimotor-rawudp-manager/README.md](${REPO_URL}/blob/${TAG}/isimotor-rawudp-manager/README.md)

          ---

          ### ⚖️ License
          [Apache License 2.0](${REPO_URL}/blob/${TAG}/LICENSE)
          RELEASE_BODY_EOF

          # Expand variables in the template
          sed -i "s|\${TAG}|${TAG}|g" release_body.md
          sed -i "s|\${REPO_URL}|${REPO_URL}|g" release_body.md
          # Remove leading whitespace from heredoc indentation
          sed -i 's/^          //' release_body.md

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: isiMotor-RawUDP Plugin ${{ steps.vars.outputs.TAG }}
          draft: false
          prerelease: false
          body_path: release_body.md
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
