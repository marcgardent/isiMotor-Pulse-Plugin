name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'

permissions:
  contents: write

jobs:
  # --- 1. Gatekeeper Tests & Version Validation ---
  run-tests:
    name: Run Test Suite & Validate Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Verify Workspace Version Consistency
        run: |
          make verify-version VERSION="${{ steps.vars.outputs.TAG }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build C++ Mock Host & Run Tests
        run: |
          make test

  # --- 2. Build Universal Plugin DLL (MinGW-w64 Cross-Compilation) ---
  build-dll:
    name: Build Universal DLL (MinGW-w64 Cross)
    runs-on: ubuntu-latest
    needs: [run-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW-w64 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake ninja-build

      - name: Build Universal isiMotor_Pulse.dll
        run: |
          make cross

      - name: Verify Built DLL
        run: |
          test -f build/isiMotor_Pulse.dll
          ls -lh build/isiMotor_Pulse.dll

      - name: Upload Universal DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-universal-dll
          path: build/isiMotor_Pulse.dll

  # --- 3. Build Standalone Manager for Windows (.exe) ---
  build-manager-windows:
    name: Build Standalone Manager (Windows x64)
    runs-on: windows-latest
    needs: [run-tests, build-dll]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Built DLL
        uses: actions/download-artifact@v4
        with:
          name: release-universal-dll
          path: staging/

      - name: Sync DLL into Manager Package Resources
        shell: bash
        run: |
          mkdir -p isimotor-pulse-manager/isimotor_pulse_manager/resources isimotor-pulse-manager/resources
          cp staging/isiMotor_Pulse.dll isimotor-pulse-manager/isimotor_pulse_manager/resources/
          cp staging/isiMotor_Pulse.dll isimotor-pulse-manager/resources/

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build Standalone Windows EXE with PyInstaller
        shell: bash
        run: |
          PYTHONPATH="isimotor-pulse-client:isimotor-pulse-manager" uv run --with pyinstaller --with textual --with rich pyinstaller --onefile --clean --name "isiMotor_Pulse_Manager" --add-data "isimotor-pulse-manager/isimotor_pulse_manager/resources;isimotor_pulse_manager/resources" --collect-all textual --collect-all rich --collect-all isimotor_pulse_manager --collect-all isimotor_pulse_client scripts/entrypoint_manager.py

      - name: Upload Windows Manager Executable
        uses: actions/upload-artifact@v4
        with:
          name: release-manager-windows
          path: dist/isiMotor_Pulse_Manager.exe

  # --- 4. Build Standalone Manager for Linux (x86_64) ---
  build-manager-linux:
    name: Build Standalone Manager (Linux x86_64)
    runs-on: ubuntu-latest
    needs: [run-tests, build-dll]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Built DLL
        uses: actions/download-artifact@v4
        with:
          name: release-universal-dll
          path: staging/

      - name: Sync DLL into Manager Package Resources
        run: |
          mkdir -p isimotor-pulse-manager/isimotor_pulse_manager/resources isimotor-pulse-manager/resources
          cp staging/isiMotor_Pulse.dll isimotor-pulse-manager/isimotor_pulse_manager/resources/
          cp staging/isiMotor_Pulse.dll isimotor-pulse-manager/resources/

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build Standalone Linux Binary with PyInstaller
        run: |
          PYTHONPATH="isimotor-pulse-client:isimotor-pulse-manager" uv run --with pyinstaller --with textual --with rich pyinstaller --onefile --clean --name "isiMotor-Pulse-Manager-x86_64" --add-data "isimotor-pulse-manager/isimotor_pulse_manager/resources:isimotor_pulse_manager/resources" --collect-all textual --collect-all rich --collect-all isimotor_pulse_manager --collect-all isimotor_pulse_client scripts/entrypoint_manager.py

      - name: Upload Linux Manager Executable
        uses: actions/upload-artifact@v4
        with:
          name: release-manager-linux
          path: dist/isiMotor-Pulse-Manager-x86_64

  # --- 5. Package Python SDKs (types + client) ---
  package-python:
    name: Build Python Packages
    runs-on: ubuntu-latest
    needs: [run-tests, build-dll]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build Types Package
        run: |
          uv run --with build python -m build binding/python/isimotor-pulse-types

      - name: Point Client Dependency at the Release Wheel URL
        # The client depends on isimotor-pulse-types, which isn't published to any
        # index (PyPI, etc.) -- only attached as a GitHub Release asset. Without this,
        # `pip install`/`uv add` of the client wheel can't resolve that dependency.
        # Rewrite it to a direct https:// URL dependency (PEP 508) pointing at this
        # same release's types wheel, so installing the client pulls it in automatically.
        # This edit is CI-only / ephemeral -- never committed back to the repo.
        run: |
          TAG="${{ steps.vars.outputs.TAG }}"
          VERSION="${TAG#v}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          TYPES_WHEEL_URL="${REPO_URL}/releases/download/${TAG}/isimotor_pulse_types-${VERSION}-py3-none-any.whl"

          sed -i "s|\"isimotor-pulse-types\",|\"isimotor-pulse-types @ ${TYPES_WHEEL_URL}\",|" \
            isimotor-pulse-client/pyproject.toml

          grep -n "isimotor-pulse-types" isimotor-pulse-client/pyproject.toml

      - name: Build Client Package
        run: |
          uv run --with build python -m build isimotor-pulse-client

      - name: Validate Distributions
        run: |
          uv run --with twine twine check binding/python/isimotor-pulse-types/dist/* isimotor-pulse-client/dist/*

      - name: Upload Python Dists
        uses: actions/upload-artifact@v4
        with:
          name: release-python-dist
          path: |
            binding/python/isimotor-pulse-types/dist/*
            isimotor-pulse-client/dist/*

  # --- 6. Package Raw FlatBuffers Schemas ---
  package-schemas:
    name: Package Raw Schemas
    runs-on: ubuntu-latest
    needs: [run-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package schemas/*.fbs into a tarball
        run: |
          make package-schemas

      - name: Upload Schemas Tarball
        uses: actions/upload-artifact@v4
        with:
          name: release-schemas
          path: build/isimotor-pulse-schemas.tar.gz

  # --- 7. Publish Release Assets ---
  publish-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-dll, build-manager-windows, build-manager-linux, package-python, package-schemas]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Tag Name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download Universal DLL
        uses: actions/download-artifact@v4
        with:
          name: release-universal-dll
          path: staging/

      - name: Download Windows Manager Executable
        uses: actions/download-artifact@v4
        with:
          name: release-manager-windows
          path: staging_manager_win/

      - name: Download Linux Manager Executable
        uses: actions/download-artifact@v4
        with:
          name: release-manager-linux
          path: staging_manager_linux/

      - name: Download Python Dists
        uses: actions/download-artifact@v4
        with:
          name: release-python-dist
          path: dist/

      - name: Download Schemas Tarball
        uses: actions/download-artifact@v4
        with:
          name: release-schemas
          path: staging_schemas/

      - name: Prepare Release Package & Assets
        run: |
          TAG="${{ steps.vars.outputs.TAG }}"
          mkdir -p staging_redist
          cp staging/isiMotor_Pulse.dll staging_redist/
          cp docs/INSTALL_REDIST_Pulse-Plugin.txt staging_redist/
          cp LICENSE staging_redist/
          cp README.md staging_redist/

          # Package redistributable release zip for Windows x64 (MinGW-w64)
          cd staging_redist
          zip -r "../isiMotor-Pulse-Plugin-${TAG}-Windows-x64-MinGW-w64.zip" .
          cd ..

          mkdir -p release_assets
          cp "isiMotor-Pulse-Plugin-${TAG}-Windows-x64-MinGW-w64.zip" release_assets/
          cp staging_manager_win/isiMotor_Pulse_Manager.exe release_assets/
          cp staging_manager_linux/isiMotor-Pulse-Manager-x86_64 release_assets/
          cp staging_schemas/isimotor-pulse-schemas.tar.gz "release_assets/isimotor-pulse-schemas-${TAG}.tar.gz"
          find dist -type f -exec cp {} release_assets/ \;
          ls -lh release_assets/

      - name: Generate Release Notes Body
        id: release_body
        run: |
          TAG="${{ steps.vars.outputs.TAG }}"
          VERSION="${TAG#v}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"

          cat > release_body.md << 'RELEASE_BODY_EOF'
          ## 🏎️ ${TAG}

          Native high-performance telemetry streaming plugin for **Le Mans Ultimate** and **rFactor 2** (isiMotor engine).
          Includes standalone executable managers and a **Python SDK**.

          ---

          ### 📦 Release Assets

          #### 🖥️ Standalone Manager (1-Click Install & Live Telemetry TUI)
          | Platform | File | Description |
          |----------|------|-------------|
          | **Windows (x64)** | `isiMotor_Pulse_Manager.exe` | Standalone portable executable (No Python required) |
          | **Linux / Steam Deck** | `isiMotor-Pulse-Manager-x86_64` | Standalone 64-bit binary (No Python required) |

          👉 **User Guide**: [USER_NOTICE.md](${REPO_URL}/blob/${TAG}/USER_NOTICE.md)

          ---

          #### 🔧 Native Plugin (Windows x64 / MinGW-w64)
          | File | Description |
          |------|-------------|
          | `isiMotor-Pulse-Plugin-${TAG}-Windows-x64-MinGW-w64.zip` | Standalone native 64-bit DLL (MinGW-w64) + installation instructions + license |

          👉 **Install Guide**: [docs/INSTALL_REDIST_Pulse-Plugin.txt](${REPO_URL}/blob/${TAG}/docs/INSTALL_REDIST_Pulse-Plugin.txt)

          ---

          #### 🐍 Python SDK (`isimotor_pulse_types` + `isimotor_pulse_client`)
          | Package | Description |
          |---------|-------------|
          | `isimotor_pulse_types` | Shared dataclasses & enums for raw UDP telemetry packets |
          | `isimotor_pulse_client` | ZeroMQ telemetry/scoring client - full fan-in (`IsiMotorClient`) or single-packet-type (`Raw`/`Domain`/`Dto`) |

          **How to install and consume wheels from this release:**

          `isimotor_pulse_client` depends on `isimotor_pulse_types` via a direct URL
          pointing at this same release, so installing the client alone pulls the types
          package in automatically — no separate install step needed.

          *Option 1 — Direct remote install via pip with release wheel URL:*
          ```bash
          pip install "${REPO_URL}/releases/download/${TAG}/isimotor_pulse_client-${VERSION}-py3-none-any.whl"
          ```

          *Option 2 — Install a locally downloaded .whl file:*
          ```bash
          pip install isimotor_pulse_client-${VERSION}-py3-none-any.whl
          ```

          *Installing `isimotor_pulse_types` on its own:*
          ```bash
          pip install "${REPO_URL}/releases/download/${TAG}/isimotor_pulse_types-${VERSION}-py3-none-any.whl"
          ```

          👉 **Client README & Examples**: [isimotor-pulse-client/README.md](${REPO_URL}/blob/${TAG}/isimotor-pulse-client/README.md)

          ---

          #### 📐 Raw FlatBuffers Schemas
          | File | Description |
          |------|-------------|
          | `isimotor-pulse-schemas-${TAG}.tar.gz` | Raw `schemas/*.fbs` sources (no generated bindings) - compile with your own `flatc` for any FlatBuffers-supported language. Each root table carries a native 4-char `file_identifier` ("magic value") for wire-format versioning. |

          👉 **Schema Sources**: [schemas/](${REPO_URL}/tree/${TAG}/schemas)

          ---

          #### 🦀 Rust Bindings (`isimotor-pulse-schemas`)

          Not published as a release asset - consumed directly as a Git dependency pinned to
          this tag (bindings are generated from `schemas/*.fbs` at build time via `build.rs`,
          no `flatc` required):

          ```toml
          [dependencies]
          isimotor-pulse-schemas = { git = "${REPO_URL}", tag = "${TAG}" }
          ```

          👉 **Crate Source & Usage**: [binding/rust/isimotor-pulse-schemas/README.md](${REPO_URL}/blob/${TAG}/binding/rust/isimotor-pulse-schemas/README.md)

          ---

          ### ⚖️ License
          [Apache License 2.0](${REPO_URL}/blob/${TAG}/LICENSE)
          RELEASE_BODY_EOF

          # Expand variables in the template
          sed -i "s|\${TAG}|${TAG}|g" release_body.md
          sed -i "s|\${VERSION}|${VERSION}|g" release_body.md
          sed -i "s|\${REPO_URL}|${REPO_URL}|g" release_body.md
          # Remove leading whitespace from heredoc indentation
          sed -i 's/^          //' release_body.md

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: ${{ steps.vars.outputs.TAG }}
          draft: false
          prerelease: false
          body_path: release_body.md
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
