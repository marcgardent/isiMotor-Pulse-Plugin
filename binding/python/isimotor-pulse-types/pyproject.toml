[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isimotor-pulse-types"
version = "1.1.0"
description = "Shared dataclasses for isiMotor / Le Mans Ultimate / rFactor 2 raw UDP telemetry packets"
readme = "README.md"
authors = [{ name = "Marc GARDENT" }]
license = "Apache-2.0"
requires-python = ">=3.8"
keywords = ["telemetry", "simracing", "lemansultimate", "rfactor2", "isimotor", "udp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "flatbuffers>=23.5.26",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["isimotor_pulse_types*"]
