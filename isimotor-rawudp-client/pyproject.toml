[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isimotor-rawudp-client"
version = "0.1.3"
description = "High-performance Python client and binary decoder for isiMotor / Le Mans Ultimate / rFactor 2 raw UDP telemetry"
readme = "README.md"
authors = [{ name = "Marc GARDENT" }]
license = "Apache-2.0"
requires-python = ">=3.8"
keywords = ["telemetry", "simracing", "lemansultimate", "rfactor2", "isimotor", "udp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["isimotor_rawudp_client*"]
