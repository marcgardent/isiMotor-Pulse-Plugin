[project]
name = "isimotor-pulse-workspace"
version = "1.0.3"
description = "High-performance zero-overhead UDP telemetry & scoring plugin for isiMotor (Le Mans Ultimate & rFactor 2) with Python SDK and Textual Manager"
readme = "README.md"
authors = [{ name = "Marc GARDENT" }]
license = "Apache-2.0"
requires-python = ">=3.8"
dependencies = []

[tool.uv.workspace]
members = [
    "isimotor-pulse-client",
    "isimotor-pulse-manager",
    "binding/python/isimotor-pulse-types",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".git",
    ".venv",
    ".briefcase",
    "build",
    "bin",
    "isimotor-pulse-plugin",
    "tests/cpp_mock",
    "binding/python/isimotor-pulse-types/isimotor_pulse_types/fbs_generated",
    "__pycache__",
    "*.egg-info",
    "*.dist-info",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E402",   # Module level import not at top of file (used for path setup)
    "SIM105", # Use contextlib.suppress (explicit try-except-pass is preferred for performance in high-freq telemetry)
    "SIM102", # Nested if statements
    "SIM112", # Environment variable capitalization
    "B008",   # Do not perform function calls in argument defaults
    "RUF012", # Mutable class attributes in dataclasses
    "UP007",  # Use X | Y for type annotations (kept Union for Python 3.8/3.9 compat)
]

[tool.ruff.lint.isort]
known-first-party = ["isimotor_pulse_client", "isimotor_pulse_manager", "isimotor_pulse_types", "scripts", "sniffer"]

[tool.mypy]
python_version = "3.10"
mypy_path = "isimotor-pulse-client:binding/python/isimotor-pulse-types"
files = [
    "isimotor-pulse-client/isimotor_pulse_client",
    "isimotor-pulse-manager/isimotor_pulse_manager",
    "binding/python/isimotor-pulse-types/isimotor_pulse_types",
    "scripts/bump_version.py",
    "scripts/french_drift.py",
    "scripts/verify_version.py",
]
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = "isimotor_pulse_types/fbs_generated/"

[[tool.mypy.overrides]]
module = "isimotor_pulse_types.fbs_generated.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "isimotor_pulse_client.*"
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "isimotor_pulse_types.*"
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["isimotor-pulse-client", "isimotor-pulse-manager", "binding/python/isimotor-pulse-types"]
testpaths = ["tests"]
python_files = ["test_*.py"]
