[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isimotor-rawudp-manager"
version = "0.6.2"
description = "Complete Manager, Telemetry Diagnostics & Automated Plugin Installer for Le Mans Ultimate and rFactor 2"
readme = "README.md"
authors = [{ name = "Marc GARDENT" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.8"
dependencies = [
    "textual>=0.50.0",
    "rich>=13.0.0",
    "pyzmq>=25.0",
    "flatbuffers>=23.5.26",
    "isimotor-rawudp-client",
    "isimotor-rawudp-types",
]

[project.scripts]
isi-manager = "isimotor_rawudp_manager.app:main"
isimotor-manager = "isimotor_rawudp_manager.app:main"
isi-benchmark = "isimotor_rawudp_manager.app:main"

[tool.uv.sources]
isimotor-rawudp-client = { workspace = true }
isimotor-rawudp-types = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["isimotor_rawudp_manager*"]

[tool.setuptools.package-data]
isimotor_rawudp_manager = ["resources/*"]

[tool.briefcase]
project_name = "isiMotor RawUDP Manager"
bundle = "com.github.marcgardent"
version = "0.6.2"
url = "https://github.com/marcgardent/isiMotor-RawUDP-Plugin"
license = "Apache-2.0"
license_files = ["LICENSE"]
author = "Marc GARDENT"
author_email = "marc.gardent@example.com"

[tool.briefcase.app.isimotor-rawudp-manager]
formal_name = "isiMotor RawUDP Manager"
description = "isiMotor telemetry diagnostics, stream inspector & automated plugin installer"
icon = "resources/icon"
console_app = true
sources = [
    "isimotor_rawudp_manager",
    "../isimotor-rawudp-client/isimotor_rawudp_client",
    "../isimotor-rawudp-types/isimotor_rawudp_types",
]
test_sources = []
# isimotor-rawudp-client/isimotor-rawudp-types are uv workspace members: they
# appear as plain names in [project].dependencies above (needed for `uv
# sync`/[tool.uv.sources] to link them), and Briefcase's dev/build commands
# merge those PEP 621 dependencies into `requires` unconditionally, then
# `pip install` them - which fails since they're not published to PyPI.
# `make briefcase-wheels` builds them into local wheels; pointing pip at that
# directory via --find-links lets it satisfy those two names without a
# network index. `sources` above is what actually puts the two packages on
# sys.path at runtime; this wheel only needs to make `pip install` succeed.
requirement_installer_args = ["--find-links", ".briefcase-wheels"]
requires = [
    "textual>=0.50.0",
    "rich>=13.0.0",
    "pyzmq>=25.0",
    "flatbuffers>=23.5.26",
]

[tool.briefcase.app.isimotor-rawudp-manager.windows]
requires = [
    "textual>=0.50.0",
    "rich>=13.0.0",
    "pyzmq>=25.0",
    "flatbuffers>=23.5.26",
]

[tool.briefcase.app.isimotor-rawudp-manager.linux]
requires = [
    "textual>=0.50.0",
    "rich>=13.0.0",
    "pyzmq>=25.0",
    "flatbuffers>=23.5.26",
]
