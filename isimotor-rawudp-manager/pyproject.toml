[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isimotor-rawudp-manager"
version = "0.4.0"
description = "Complete Manager, Telemetry Diagnostics & Automated Plugin Installer for Le Mans Ultimate and rFactor 2"
readme = "README.md"
authors = [{ name = "Marc GARDENT" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.8"
dependencies = [
    "textual>=0.50.0",
    "rich>=13.0.0",
    "isimotor-rawudp-client",
]

[project.scripts]
isi-manager = "isimotor_rawudp_manager.app:main"
isimotor-manager = "isimotor_rawudp_manager.app:main"
isi-benchmark = "isimotor_rawudp_manager.app:main"

[tool.uv.sources]
isimotor-rawudp-client = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["isimotor_rawudp_manager*"]

[tool.setuptools.package-data]
isimotor_rawudp_manager = ["resources/*"]

[tool.briefcase]
project_name = "isiMotor RawUDP Manager"
bundle = "com.github.marcgardent"
version = "0.4.0"
url = "https://github.com/marcgardent/isiMotor-RawUDP-Plugin"
license = "Apache-2.0"
license_files = ["LICENSE"]
author = "Marc GARDENT"
author_email = "marc.gardent@example.com"

[tool.briefcase.app.isimotor-rawudp-manager]
formal_name = "isiMotor RawUDP Manager"
description = "isiMotor telemetry diagnostics, stream inspector & automated plugin installer"
icon = "resources/icon"
console_app = true
sources = [
    "isimotor_rawudp_manager",
    "../isimotor-rawudp-client/isimotor_rawudp_client",
]
test_sources = []
requires = [
    "textual>=0.50.0",
    "rich>=13.0.0",
]

[tool.briefcase.app.isimotor-rawudp-manager.windows]
requires = [
    "textual>=0.50.0",
    "rich>=13.0.0",
]

[tool.briefcase.app.isimotor-rawudp-manager.linux]
requires = [
    "textual>=0.50.0",
    "rich>=13.0.0",
]
